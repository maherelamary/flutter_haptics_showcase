name: flutter_haptics_showcase
description: "Flutter Haptics Tactile — flutter_haptics in real UI: a component gallery, a creative lab, end-to-end flows and a pattern studio."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter

  # Pinned to a release tag.
  flutter_haptics:
    git:
      url: https://github.com/maherelamary/flutter_haptics.git
      ref: v1.0.0

  # HapticPacer reads the time through clock, as the package's handles do.
  clock: ^1.1.1
  flutter_riverpod: ^3.2.1
  go_router: ^17.1.0
  shared_preferences: ^2.5.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
